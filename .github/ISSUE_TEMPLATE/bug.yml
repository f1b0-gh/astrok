name: Bug report
description: Report a reproducible problem in Astrok.
body:
  - type: markdown
    attributes:
      value: For suspected vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Astrok package versions or commit, Node, Astro, OS and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal files or repository and exact commands. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant error output.
    validations:
      required: true
