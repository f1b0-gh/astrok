name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  pages-build:
    name: Static Pages verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Pages URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - name: Build static sample
        env:
          ASTROK_SITE: ${{ steps.pages.outputs.origin || 'https://f1b0-gh.github.io' }}
          ASTROK_BASE: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_path) || '/astrok/' }}
          ASTROK_STATIC_DEMO: '1'
        run: npm run build
      - run: npm run check --workspace @astrokjs/example-workspace
      - run: npx playwright install --with-deps chromium
      - name: Test static hosting
        env:
          ASTROK_SITE: ${{ steps.pages.outputs.origin || 'https://f1b0-gh.github.io' }}
          ASTROK_BASE: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_path) || '/astrok/' }}
        run: npm run test:pages
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/workspace/dist

  deploy:
    name: Deploy Astrok
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, pages-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
