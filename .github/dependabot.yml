version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '21:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    groups:
      solid:
        patterns:
          - 'solid-js'
          - '@solidjs/*'
